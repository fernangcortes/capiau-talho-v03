[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Testes unitários rápidos sem rede, modelos locais pesados ou subprocessos externos
    integration: Testes de integração controlada (SQLite, filesystem temporário, FastAPI)
    models: Testes que exigem modelos/pesos locais de IA baixados
    network: Testes que exigem acesso à rede ou APIs externas
    slow: Testes lentos (render FFmpeg, stress ou suítes extensas)
    e2e: Testes ponta a ponta completos de fluxos do produto
