<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#14141f"/>
    </linearGradient>
  </defs>

  <rect width="880" height="320" rx="14" fill="url(#bgGrad)" stroke="#27273a" stroke-width="1.5"/>

  <!-- Left: Talho Timeline -->
  <g transform="translate(40, 60)">
    <rect width="220" height="200" rx="12" fill="#161622" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="25" y="40" fill="#a78bfa" font-family="sans-serif" font-size="14" font-weight="700">🎬 CapIAu-Talho</text>
    <text x="25" y="65" fill="#e2e8f0" font-family="sans-serif" font-size="12">Timeline Canvas 2D</text>
    <text x="25" y="90" fill="#94a3b8" font-family="sans-serif" font-size="11">• Pistas V1, V2, V3</text>
    <text x="25" y="110" fill="#94a3b8" font-family="sans-serif" font-size="11">• Pistas A1 a A4</text>
    <text x="25" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11">• J/L-Cuts &amp; Sync Lock</text>
    <text x="25" y="150" fill="#94a3b8" font-family="sans-serif" font-size="11">• Decupagem &amp; Logging</text>
    <text x="25" y="180" fill="#06b6d4" font-family="sans-serif" font-size="12" font-weight="700">Exportador Universal</text>
  </g>

  <!-- Connectors -->
  <path d="M 260 160 L 360 85" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3" fill="none"/>
  <path d="M 260 160 L 360 135" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3,3" fill="none"/>
  <path d="M 260 160 L 360 185" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,3" fill="none"/>
  <path d="M 260 160 L 360 235" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" fill="none"/>

  <!-- Target 1: Kdenlive -->
  <g transform="translate(360, 60)">
    <rect width="480" height="42" rx="8" fill="#161622" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="20" y="26" fill="#06b6d4" font-family="sans-serif" font-size="12" font-weight="700">🐧 Kdenlive (25.04+)</text>
    <text x="180" y="26" fill="#e2e8f0" font-family="sans-serif" font-size="11">OpenTimelineIO (.otio) nativo com relink direto</text>
  </g>

  <!-- Target 2: Premiere -->
  <g transform="translate(360, 110)">
    <rect width="480" height="42" rx="8" fill="#161622" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="20" y="26" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="700">🎬 Adobe Premiere</text>
    <text x="180" y="26" fill="#e2e8f0" font-family="sans-serif" font-size="11">Final Cut Pro 7 XML (.xml) com pistas conformadas</text>
  </g>

  <!-- Target 3: DaVinci Resolve -->
  <g transform="translate(360, 160)">
    <rect width="480" height="42" rx="8" fill="#161622" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="20" y="26" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700">🎨 DaVinci Resolve</text>
    <text x="180" y="26" fill="#e2e8f0" font-family="sans-serif" font-size="11">FCP7 XML ou .otio com preservação de timecodes</text>
  </g>

  <!-- Target 4: FFmpeg Master -->
  <g transform="translate(360, 210)">
    <rect width="480" height="42" rx="8" fill="#161622" stroke="#10b981" stroke-width="1.2"/>
    <text x="20" y="26" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">📹 Render Direto FFmpeg</text>
    <text x="180" y="26" fill="#e2e8f0" font-family="sans-serif" font-size="11">MP4 H.264 / ProRes Master com títulos e áudio</text>
  </g>
</svg>
