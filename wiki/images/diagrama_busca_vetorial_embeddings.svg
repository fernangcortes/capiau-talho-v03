<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo Dark Glassmorphism -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#14141f"/>
    </linearGradient>

    <!-- Gradientes de Cards Internos -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>

    <!-- Halos de Densidade dos Clusters -->
    <radialGradient id="clusterVioletHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="clusterCyanHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="clusterEmeraldHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Marcadores de Flechas Vetoriais -->
    <marker id="arrowVectorU" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowVectorV" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#06b6d4"/>
    </marker>
    <marker id="arrowVectorW" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowFlow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Fundo Principal -->
  <rect width="880" height="500" rx="14" fill="url(#bgGrad)" stroke="#27273a" stroke-width="1.5"/>

  <!-- Título Superior & Subtítulo -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="8" height="28" rx="3" fill="#8b5cf6"/>
    <text x="18" y="16" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">BUSCA VETORIAL SEMÂNTICA NO QDRANT • EMBEDDINGS &amp; SIMILARIDADE COSSENO</text>
    <text x="18" y="31" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Projeção densa (512-d CLIP / 768-d ModernBERT), agrupamento de clusters e fluxo Click-to-Search do Talho</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LADO ESQUERDO: O HIPERESPAÇO VETORIAL (PROJEÇÃO 2D)                       -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 65)">
    <!-- Moldura Glass do Espaço Vetorial -->
    <rect width="435" height="415" rx="10" fill="url(#cardGrad)" stroke="#27273a" stroke-width="1.2"/>

    <!-- Cabeçalho do Card -->
    <path d="M 1 11 Q 1 1 11 1 L 424 1 Q 434 1 434 11 L 434 28 L 1 28 Z" fill="#1e1e2d"/>
    <line x1="0" y1="28" x2="435" y2="28" stroke="#2a2a3e" stroke-width="1"/>
    <text x="16" y="19" fill="#8b5cf6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">ESPAÇO LATENTE MULTIMODAL (512-D / 768-D)</text>

    <!-- GRÁFICO DO ESPAÇO VETORIAL -->
    <g transform="translate(25, 45)">
      <!-- Grade Cartesiana & Círculos de Distância Cosine -->
      <!-- Origem em (X=50, Y=310) -->
      <line x1="50" y1="20" x2="50" y2="310" stroke="#334155" stroke-width="1.2"/>
      <line x1="50" y1="310" x2="380" y2="310" stroke="#334155" stroke-width="1.2"/>

      <!-- Círculos de raio de normalização (norma unitária ||v|| = 1) -->
      <circle cx="50" cy="310" r="100" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
      <circle cx="50" cy="310" r="200" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
      <circle cx="50" cy="310" r="280" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Rótulos dos eixos -->
      <text x="50" y="15" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Dimensão n (Semântica)</text>
      <text x="380" y="325" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="end">Dimensão 1 (Visual)</text>
      <text x="38" y="325" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">(0,0)</text>

      <!-- CLUSTER 1: ROSTOS & DEPOIMENTOS (Violeta) -->
      <!-- Centro do cluster em cx=240, cy=110 -->
      <circle cx="240" cy="110" r="75" fill="url(#clusterVioletHalo)"/>
      <circle cx="240" cy="110" r="75" fill="none" stroke="#8b5cf6" stroke-width="0.8" stroke-dasharray="3,3"/>
      <!-- Pontos do cluster -->
      <circle cx="225" cy="95" r="3.5" fill="#c4b5fd"/>
      <circle cx="245" cy="85" r="3.5" fill="#c4b5fd"/>
      <circle cx="260" cy="115" r="4" fill="#a78bfa"/>
      <circle cx="215" cy="125" r="3.5" fill="#a78bfa"/>
      <circle cx="250" cy="130" r="3" fill="#c4b5fd"/>
      <circle cx="230" cy="110" r="4.5" fill="#8b5cf6"/>
      <text x="240" y="55" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">🟣 Cluster: Rostos &amp; Atores</text>

      <!-- CLUSTER 2: B-ROLL & MAQUINÁRIO DE SET (Ciano) -->
      <!-- Centro do cluster em cx=305, cy=235 -->
      <circle cx="305" cy="235" r="60" fill="url(#clusterCyanHalo)"/>
      <circle cx="305" cy="235" r="60" fill="none" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="3,3"/>
      <!-- Pontos do cluster -->
      <circle cx="290" cy="220" r="3.5" fill="#67e8f9"/>
      <circle cx="320" cy="215" r="3.5" fill="#67e8f9"/>
      <circle cx="310" cy="250" r="4" fill="#22d3ee"/>
      <circle cx="280" cy="245" r="3.5" fill="#22d3ee"/>
      <circle cx="330" cy="235" r="3" fill="#67e8f9"/>
      <text x="315" y="300" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">🔵 Cluster: B-Roll &amp; Objetos</text>

      <!-- CLUSTER 3: PLANOS GERAIS & PAISAGENS (Esmeralda) -->
      <!-- Centro do cluster em cx=115, cy=95 -->
      <circle cx="115" cy="95" r="55" fill="url(#clusterEmeraldHalo)"/>
      <circle cx="115" cy="95" r="55" fill="none" stroke="#10b981" stroke-width="0.8" stroke-dasharray="3,3"/>
      <!-- Pontos do cluster -->
      <circle cx="100" cy="85" r="3.5" fill="#6ee7b7"/>
      <circle cx="125" cy="80" r="3.5" fill="#6ee7b7"/>
      <circle cx="115" cy="110" r="4" fill="#34d399"/>
      <circle cx="95" cy="105" r="3" fill="#34d399"/>
      <text x="115" y="35" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">🟢 Cluster: Planos Gerais</text>

      <!-- VETORES DESTACADOS -->
      <!-- Vetor u: Frame do Ator no Player (cx=235, cy=105) -->
      <line x1="50" y1="310" x2="235" y2="105" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrowVectorU)"/>
      <text x="145" y="195" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Vetor u (Frame Ator)</text>

      <!-- Vetor v: Prompt de Busca Textual (cx=265, cy=135) -->
      <line x1="50" y1="310" x2="265" y2="135" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arrowVectorV)"/>
      <text x="210" y="240" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Vetor v ("diretor sorrindo")</text>

      <!-- Arco do Ângulo Theta (θ) -->
      <!-- Raio ~85px da origem. Vetor u tem ângulo ~48 deg, vetor v tem ângulo ~39 deg -->
      <path d="M 108 245 A 85 85 0 0 1 118 255" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
      <text x="128" y="252" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">θ = 14°</text>

      <!-- Badge de Similaridade Alta -->
      <g transform="translate(140, 265)">
        <rect x="0" y="0" width="145" height="20" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
        <text x="72" y="14" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">cos(θ) = 0.97 • MATCH ALTO!</text>
      </g>

      <!-- Vetor w (Dissidente / Sem Relação - Planos Gerais) -->
      <line x1="50" y1="310" x2="115" y2="105" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowVectorW)"/>
      <text x="65" y="160" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Vetor w ("paisagem") • θ=52° cos(θ)=0.61</text>
    </g>

    <!-- Rodapé explicativo do gráfico -->
    <text x="20" y="398" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">
      Conceitos parecidos apontam para a mesma direção angular, independentemente de estarem em texto ou em imagem.
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- LADO DIREITO: FÓRMULA DO COSSENO & FLUXO CLICK-TO-SEARCH                  -->
  <!-- ========================================================================= -->

  <!-- CARD SUPERIOR: A FÓRMULA DA SIMILARIDADE COSSENO -->
  <g transform="translate(480, 65)">
    <rect width="375" height="155" rx="10" fill="url(#cardGrad)" stroke="#27273a" stroke-width="1.2"/>
    <path d="M 1 11 Q 1 1 11 1 L 364 1 Q 374 1 374 11 L 374 26 L 1 26 Z" fill="#1e1e2d"/>
    <line x1="0" y1="26" x2="375" y2="26" stroke="#2a2a3e" stroke-width="1"/>
    
    <text x="14" y="18" fill="#06b6d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">MÉTRICA MATEMÁTICA: SIMILARIDADE COSSENO</text>

    <!-- Equação Estilizada com Caixas Glass -->
    <g transform="translate(18, 38)">
      <rect x="0" y="0" width="340" height="48" rx="6" fill="#111119" stroke="#3b82f6" stroke-width="1"/>

      <!-- Fórmula Renderizada -->
      <text x="15" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
        <tspan fill="#67e8f9">cos(θ)</tspan>
        <tspan fill="#94a3b8"> = </tspan>
        <tspan fill="#c4b5fd">u · v</tspan>
        <tspan fill="#94a3b8"> / ( </tspan>
        <tspan fill="#ffffff">||u|| · ||v||</tspan>
        <tspan fill="#94a3b8"> )</tspan>
      </text>

      <!-- Barra de Fração Estendida -->
      <text x="190" y="24" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Σ (uᵢ · vᵢ)</text>
      <line x1="145" y1="28" x2="235" y2="28" stroke="#64748b" stroke-width="1"/>
      <text x="190" y="40" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">√(Σ uᵢ²) · √(Σ vᵢ²)</text>

      <rect x="250" y="12" width="78" height="24" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8"/>
      <text x="289" y="28" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">-1.0 a +1.0</text>
    </g>

    <!-- Faixas de Decisão no Talho -->
    <g transform="translate(18, 96)">
      <text x="0" y="12" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">Critérios de Relevância Semântica:</text>
      
      <circle cx="6" cy="27" r="3" fill="#10b981"/>
      <text x="14" y="30" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">
        <tspan font-weight="700">&gt; 0.85:</tspan> Tomada idêntica ou ângulo do mesmo personagem
      </text>

      <circle cx="6" cy="42" r="3" fill="#06b6d4"/>
      <text x="14" y="45" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">
        <tspan font-weight="700">0.70 a 0.85:</tspan> Contexto direto de roteiro / mesma cena
      </text>
    </g>
  </g>

  <!-- CARD INFERIOR: FLUXO CLICK-TO-SEARCH NO TALHO -->
  <g transform="translate(480, 235)">
    <rect width="375" height="245" rx="10" fill="url(#cardGrad)" stroke="#27273a" stroke-width="1.2"/>
    <path d="M 1 11 Q 1 1 11 1 L 364 1 Q 374 1 374 11 L 374 26 L 1 26 Z" fill="#1e1e2d"/>
    <line x1="0" y1="26" x2="375" y2="26" stroke="#2a2a3e" stroke-width="1"/>
    
    <text x="14" y="18" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">FLUXO CLICK-TO-SEARCH NO TALHO (SUB-50MS)</text>

    <!-- ETAPAS DO PIPELINE -->
    <!-- Etapa 1: Bounding Box no Player -->
    <g transform="translate(18, 38)">
      <rect x="0" y="0" width="340" height="40" rx="5" fill="#161622" stroke="#334155" stroke-width="0.8"/>
      <circle cx="20" cy="20" r="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
      <text x="20" y="24" fill="#8b5cf6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">1</text>
      
      <text x="38" y="17" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700">Clique na Bounding Box no Player</text>
      <text x="38" y="29" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Editor clica no rosto do ator ou objeto detectado na tela</text>
    </g>

    <!-- Seta Conectora 1 -> 2 -->
    <path d="M 188 80 L 188 88" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowFlow)"/>

    <!-- Etapa 2: Extração de Embedding -->
    <g transform="translate(18, 92)">
      <rect x="0" y="0" width="340" height="40" rx="5" fill="#161622" stroke="#334155" stroke-width="0.8"/>
      <circle cx="20" cy="20" r="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
      <text x="20" y="24" fill="#06b6d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">2</text>
      
      <text x="38" y="17" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700">Extração de Embedding (15ms • ONNX CPU)</text>
      <text x="38" y="29" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">SCRFD + ArcFace gera vetor 512-d normalizado ||v||=1</text>
    </g>

    <!-- Seta Conectora 2 -> 3 -->
    <path d="M 188 134 L 188 142" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowFlow)"/>

    <!-- Etapa 3: Busca no Qdrant HNSW -->
    <g transform="translate(18, 146)">
      <rect x="0" y="0" width="340" height="40" rx="5" fill="#161622" stroke="#334155" stroke-width="0.8"/>
      <circle cx="20" cy="20" r="10" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="20" y="24" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">3</text>
      
      <text x="38" y="17" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700">Qdrant HNSW Nearest Neighbors (12ms)</text>
      <text x="38" y="29" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Varredura no grafo vetorial indexado em memória</text>
    </g>

    <!-- Seta Conectora 3 -> 4 -->
    <path d="M 188 188 L 188 196" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowFlow)"/>

    <!-- Etapa 4: Exibição no Chat/Timeline -->
    <g transform="translate(18, 200)">
      <rect x="0" y="0" width="340" height="36" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="170" y="16" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">🎯 Resultado Instantâneo na Biblioteca</text>
      <text x="170" y="28" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">Clipes ordenados por score prontos para arrastar à timeline</text>
    </g>
  </g>
</svg>
