<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo Dark Glassmorphism -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#14141f"/>
    </linearGradient>

    <!-- Gradientes de Cards Internos -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>

    <!-- Gradientes de Clipes NLE -->
    <linearGradient id="clipBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="clipAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="clipViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="clipTrimmed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="clipCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Marcadores de Flechas -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#06b6d4"/>
    </marker>
    <marker id="arrowRose" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Fundo Principal -->
  <rect width="880" height="500" rx="14" fill="url(#bgGrad)" stroke="#27273a" stroke-width="1.5"/>

  <!-- Título Superior & Subtítulo -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="8" height="28" rx="3" fill="#06b6d4"/>
    <text x="18" y="16" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">TIMELINE NLE • RIPPLE TRIM vs ROLL TRIM</text>
    <text x="18" y="31" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Comparativo de aparamento dinâmico: alteração de duração total vs preservação de sincronia e parede divisória</text>
  </g>

  <!-- ========================================================================= -->
  <!-- SEÇÃO 1: RIPPLE TRIM (ONDULAÇÃO / EFEITO SANFONA)                         -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 65)">
    <!-- Moldura Glass do Painel Ripple -->
    <rect width="830" height="195" rx="10" fill="url(#cardGrad)" stroke="#27273a" stroke-width="1.2"/>

    <!-- Cabeçalho do Card Ripple -->
    <path d="M 1 11 Q 1 1 11 1 L 819 1 Q 829 1 829 11 L 829 28 L 1 28 Z" fill="#1e1e2d"/>
    <line x1="0" y1="28" x2="830" y2="28" stroke="#2a2a3e" stroke-width="1"/>
    
    <text x="16" y="19" fill="#06b6d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">1. RIPPLE TRIM (ONDULAÇÃO • EFEITO SANFONA)</text>

    <!-- Badges de Atalhos e Sync Lock -->
    <g transform="translate(430, 6)">
      <rect x="0" y="0" width="48" height="16" rx="3" fill="#0f172a" stroke="#06b6d4" stroke-width="0.8"/>
      <text x="24" y="12" fill="#06b6d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Q / W</text>

      <rect x="54" y="0" width="130" height="16" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <text x="119" y="12" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Atalho Rápido Head/Tail</text>

      <rect x="190" y="0" width="95" height="16" rx="3" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="0.8"/>
      <text x="237" y="12" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" text-anchor="middle">🔒 Sync Lock Ativo</text>

      <rect x="290" y="0" width="98" height="16" rx="3" fill="#3f131f" stroke="#f43f5e" stroke-width="0.8"/>
      <text x="339" y="12" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Δ Duração Muda</text>
    </g>

    <!-- ESTADO: ANTES (Timeline Original: 16 segundos) -->
    <g transform="translate(16, 42)">
      <text x="0" y="14" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">ANTES:</text>
      
      <!-- Cabeçalho Track V1 -->
      <rect x="55" y="0" width="35" height="22" rx="3" fill="#13131c" stroke="#334155"/>
      <text x="72" y="15" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">V1</text>

      <!-- Clipes Timeline Original -->
      <!-- Clipe A (0s - 4s = 160px) -->
      <rect x="95" y="0" width="160" height="22" rx="3" fill="url(#clipBlue)" stroke="#3b82f6" stroke-width="0.8"/>
      <text x="175" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Clipe A (4s)</text>

      <!-- Clipe B (4s - 10s = 240px) -->
      <rect x="257" y="0" width="240" height="22" rx="3" fill="url(#clipAmber)" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="377" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Clipe B (6s) • Alvo do Trim</text>

      <!-- Clipe C (10s - 16s = 240px) -->
      <rect x="499" y="0" width="240" height="22" rx="3" fill="url(#clipViolet)" stroke="#a78bfa" stroke-width="0.8"/>
      <text x="619" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Clipe C (6s)</text>

      <!-- Marcador de Fim da Timeline (16s) -->
      <line x1="739" y1="-5" x2="739" y2="27" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2,2"/>
      <text x="744" y="15" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Total: 16s</text>
    </g>

    <!-- AÇÃO INTERMEDIÁRIA: O CORTE POR ONDULAÇÃO (Encurtar Clipe B em 2s com Q/W) -->
    <g transform="translate(71, 78)">
      <!-- Zona removida em Clipe B -->
      <rect x="417" y="0" width="80" height="18" rx="2" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="457" y="13" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">-2s Cortados (Tail)</text>

      <!-- Seta Ondulação puxando para a esquerda -->
      <path d="M 577 9 L 515 9" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowCyan)" fill="none"/>
      <text x="595" y="13" fill="#06b6d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">Ondulação fecha o vácuo (Ripple Pull)</text>
    </g>

    <!-- ESTADO: DEPOIS (Timeline Encolhida para 14s) -->
    <g transform="translate(16, 110)">
      <text x="0" y="14" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">DEPOIS:</text>

      <!-- Cabeçalho Track V1 -->
      <rect x="55" y="0" width="35" height="22" rx="3" fill="#13131c" stroke="#334155"/>
      <text x="72" y="15" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">V1</text>

      <!-- Clipe A (inalterado: 4s) -->
      <rect x="95" y="0" width="160" height="22" rx="3" fill="url(#clipBlue)" stroke="#3b82f6" stroke-width="0.8"/>
      <text x="175" y="15" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Clipe A (4s)</text>

      <!-- Clipe B (encurtado: 4s em vez de 6s) -->
      <rect x="257" y="0" width="160" height="22" rx="3" fill="url(#clipAmber)" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="337" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Clipe B (4s)</text>

      <!-- Clipe C (deslocado 2s à esquerda, agora encostado em 8s) -->
      <rect x="419" y="0" width="240" height="22" rx="3" fill="url(#clipViolet)" stroke="#a78bfa" stroke-width="0.8"/>
      <text x="539" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Clipe C (6s) • Puxado à Esquerda</text>

      <!-- Marcador da Duração Reduzida (14s) -->
      <line x1="659" y1="-5" x2="659" y2="27" stroke="#10b981" stroke-width="1.8"/>
      <text x="665" y="15" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Novo Total: 14s (-2s)</text>

      <!-- Linha fantasma da duração original para contraste -->
      <line x1="739" y1="-5" x2="739" y2="27" stroke="#475569" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="665" y="27" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Duração anterior: 16s</text>
    </g>

    <!-- Legenda didática do Ripple -->
    <g transform="translate(16, 155)">
      <rect x="55" y="0" width="745" height="28" rx="4" fill="#13141f" stroke="#252538"/>
      <text x="70" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">
        <tspan fill="#06b6d4" font-weight="700">💡 Analogia da Sanfona / Colar de Contas:</tspan>
        <tspan fill="#94a3b8"> Ao encurtar um clipe com </tspan>
        <tspan fill="#ffffff" font-weight="600">Q</tspan>
        <tspan fill="#94a3b8"> ou </tspan>
        <tspan fill="#ffffff" font-weight="600">W</tspan>
        <tspan fill="#94a3b8">, não fica buraco (gap). Todos os clipes à direita deslizam automaticamente, diminuindo o projeto inteiro.</tspan>
      </text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- SEÇÃO 2: ROLL TRIM (ROLAGEM / PAREDE DIVISÓRIA)                           -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 280)">
    <!-- Moldura Glass do Painel Roll -->
    <rect width="830" height="195" rx="10" fill="url(#cardGrad)" stroke="#27273a" stroke-width="1.2"/>

    <!-- Cabeçalho do Card Roll -->
    <path d="M 1 11 Q 1 1 11 1 L 819 1 Q 829 1 829 11 L 829 28 L 1 28 Z" fill="#1e1e2d"/>
    <line x1="0" y1="28" x2="830" y2="28" stroke="#2a2a3e" stroke-width="1"/>
    
    <text x="16" y="19" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">2. ROLL TRIM (ROLAGEM • PAREDE DIVISÓRIA)</text>

    <!-- Badges de Atalhos e Duração Inalterada -->
    <g transform="translate(450, 6)">
      <rect x="0" y="0" width="35" height="16" rx="3" fill="#0f172a" stroke="#8b5cf6" stroke-width="0.8"/>
      <text x="17" y="12" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">N</text>

      <rect x="41" y="0" width="135" height="16" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <text x="108" y="12" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Ferramenta Rolling Edit</text>

      <rect x="182" y="0" width="180" height="16" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
      <text x="272" y="12" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">🔒 DURAÇÃO TOTAL RIGOROSA: 16s</text>
    </g>

    <!-- ESTADO: ANTES (Timeline Original: 16 segundos) -->
    <g transform="translate(16, 42)">
      <text x="0" y="14" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">ANTES:</text>

      <!-- Cabeçalho Track V1 -->
      <rect x="55" y="0" width="35" height="22" rx="3" fill="#13131c" stroke="#334155"/>
      <text x="72" y="15" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">V1</text>

      <!-- Clipe A (0s - 6s = 240px) -->
      <rect x="95" y="0" width="240" height="22" rx="3" fill="url(#clipBlue)" stroke="#3b82f6" stroke-width="0.8"/>
      <text x="215" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Clipe A (6s)</text>

      <!-- Ponto de Corte Original (Emenda A-B em 6s) -->
      <line x1="335" y1="-3" x2="335" y2="25" stroke="#f43f5e" stroke-width="2"/>
      <circle cx="335" cy="11" r="4" fill="#f43f5e"/>

      <!-- Clipe B (6s - 12s = 240px) -->
      <rect x="337" y="0" width="240" height="22" rx="3" fill="url(#clipCyan)" stroke="#06b6d4" stroke-width="0.8"/>
      <text x="457" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Clipe B (6s)</text>

      <!-- Clipe C (12s - 16s = 160px) -->
      <rect x="579" y="0" width="160" height="22" rx="3" fill="url(#clipViolet)" stroke="#a78bfa" stroke-width="0.8"/>
      <text x="659" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Clipe C (4s)</text>

      <!-- Fim da Timeline (16s) -->
      <line x1="739" y1="-5" x2="739" y2="27" stroke="#10b981" stroke-width="1.8"/>
      <text x="744" y="15" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">Total: 16s</text>
    </g>

    <!-- AÇÃO INTERMEDIÁRIA: MOVENDO A PAREDE DIVISÓRIA (Edit Point) -->
    <g transform="translate(71, 78)">
      <!-- Seta indicando o deslocamento do corte 2s para a direita -->
      <path d="M 335 9 L 415 9" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrowAmber)" fill="none"/>
      <text x="210" y="13" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">Clipe A expande +2s (Tail)</text>
      <text x="430" y="13" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">Clipe B encolhe -2s (Head)</text>
    </g>

    <!-- ESTADO: DEPOIS (Ponto de Corte Deslocado, Clipe C Parado, Total Idêntico) -->
    <g transform="translate(16, 110)">
      <text x="0" y="14" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">DEPOIS:</text>

      <!-- Cabeçalho Track V1 -->
      <rect x="55" y="0" width="35" height="22" rx="3" fill="#13131c" stroke="#334155"/>
      <text x="72" y="15" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">V1</text>

      <!-- Clipe A (expandido de 6s para 8s = 320px) -->
      <rect x="95" y="0" width="320" height="22" rx="3" fill="url(#clipBlue)" stroke="#3b82f6" stroke-width="0.8"/>
      <text x="255" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Clipe A Agora (8s) • +2s adicionados</text>

      <!-- Novo Ponto de Corte (em 8s) -->
      <line x1="415" y1="-3" x2="415" y2="25" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="415" cy="11" r="4" fill="#f59e0b"/>

      <!-- Clipe B (encurtado de 6s para 4s = 160px) -->
      <rect x="417" y="0" width="160" height="22" rx="3" fill="url(#clipCyan)" stroke="#06b6d4" stroke-width="0.8"/>
      <text x="497" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Clipe B (4s) • -2s</text>

      <!-- Clipe C (intocado em 12s - 16s = 160px) -->
      <rect x="579" y="0" width="160" height="22" rx="3" fill="url(#clipViolet)" stroke="#a78bfa" stroke-width="0.8"/>
      <text x="659" y="15" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Clipe C (4s) • Estático</text>

      <!-- Fim da Timeline (Continua em 16s exatos!) -->
      <line x1="739" y1="-5" x2="739" y2="27" stroke="#10b981" stroke-width="1.8"/>
      <text x="744" y="15" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">Total: 16s (0s)</text>
    </g>

    <!-- Legenda didática do Roll -->
    <g transform="translate(16, 155)">
      <rect x="55" y="0" width="745" height="28" rx="4" fill="#13141f" stroke="#252538"/>
      <text x="70" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">
        <tspan fill="#a78bfa" font-weight="700">🏠 Analogia da Parede Divisória:</tspan>
        <tspan fill="#94a3b8"> Ao empurrar a parede entre dois cômodos adjacentes com </tspan>
        <tspan fill="#ffffff" font-weight="600">N (Rolling Tool)</tspan>
        <tspan fill="#94a3b8">, um cômodo cresce exatamente o que o outro diminui. A casa inteira permanece do mesmo tamanho!</tspan>
      </text>
    </g>
  </g>
</svg>
