<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#14141f"/>
    </linearGradient>
  </defs>

  <rect width="880" height="340" rx="14" fill="url(#bgGrad)" stroke="#27273a" stroke-width="1.5"/>

  <!-- Audio Input -->
  <g transform="translate(40, 25)">
    <rect width="800" height="45" rx="8" fill="#1e1e2f" stroke="#475569" stroke-width="1"/>
    <text x="25" y="28" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">🎙️ Áudio Bruto Gravado no Set (Voz Baixa, Ruído de Ar, Eco, Vento)</text>
  </g>

  <!-- Connectors -->
  <line x1="170" y1="70" x2="170" y2="100" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="440" y1="70" x2="440" y2="100" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="710" y1="70" x2="710" y2="100" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Layer 1 -->
  <g transform="translate(40, 100)">
    <rect width="250" height="135" rx="10" fill="#161622" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="20" y="30" fill="#06b6d4" font-family="sans-serif" font-size="12" font-weight="700">CAMADA 1 • TEMPO REAL</text>
    <text x="20" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="11">🎛️ Equalizador 3 Bandas</text>
    <text x="20" y="75" fill="#e2e8f0" font-family="sans-serif" font-size="11">🔇 High-Pass (80 / 120 Hz)</text>
    <text x="20" y="95" fill="#e2e8f0" font-family="sans-serif" font-size="11">⚡ Limiter / Compressor</text>
    <text x="20" y="118" fill="#94a3b8" font-family="sans-serif" font-size="10">Latência: 0 ms • CPU Nativa</text>
  </g>

  <!-- Layer 2 -->
  <g transform="translate(315, 100)">
    <rect width="250" height="135" rx="10" fill="#161622" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="20" y="30" fill="#a78bfa" font-family="sans-serif" font-size="12" font-weight="700">CAMADA 2 • IA LOCAL (CPU)</text>
    <text x="20" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="11">🧠 DeepFilterNet Neural</text>
    <text x="20" y="75" fill="#e2e8f0" font-family="sans-serif" font-size="11">💨 Supressão Contínua</text>
    <text x="20" y="95" fill="#e2e8f0" font-family="sans-serif" font-size="11">🔒 100% Offline e Privado</text>
    <text x="20" y="118" fill="#94a3b8" font-family="sans-serif" font-size="10">Excelente para tráfego e salas</text>
  </g>

  <!-- Layer 3 -->
  <g transform="translate(590, 100)">
    <rect width="250" height="135" rx="10" fill="#161622" stroke="#10b981" stroke-width="1.2"/>
    <text x="20" y="30" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">CAMADA 3 • NUVEM PRO</text>
    <text x="20" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="11">☁️ Auphonic REST API</text>
    <text x="20" y="75" fill="#e2e8f0" font-family="sans-serif" font-size="11">🎙️ Adaptive Speech Leveler</text>
    <text x="20" y="95" fill="#e2e8f0" font-family="sans-serif" font-size="11">⚡ Hum Filter 50/60 Hz</text>
    <text x="20" y="118" fill="#94a3b8" font-family="sans-serif" font-size="10">Padrão Broadcast EBU R128</text>
  </g>

  <!-- Bottom Comparison -->
  <g transform="translate(40, 260)">
    <rect width="800" height="55" rx="10" fill="#161622" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="25" y="25" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700">🎧 AUDIÇÃO E COMPARAÇÃO A/B EM TEMPO REAL</text>
    <text x="25" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="11">Alternância instantânea entre sinal bruto e tratado com nivelamento de ganho perceptual (Loudness Matching).</text>
  </g>
</svg>
