<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#14141f"/>
    </linearGradient>
    <linearGradient id="cyanPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="880" height="380" rx="14" fill="url(#bgGrad)" stroke="#27273a" stroke-width="1.5"/>

  <!-- Query Box -->
  <g transform="translate(240, 30)">
    <rect width="400" height="50" rx="25" fill="#1e1e2f" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="30" y="31" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">🔍 "diretor gesticulando no set sob luz quente"</text>
  </g>

  <!-- Connectors -->
  <path d="M 440 80 L 160 140" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3" fill="none"/>
  <path d="M 440 80 L 440 140" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3,3" fill="none"/>
  <path d="M 440 80 L 720 140" stroke="#ec4899" stroke-width="2" stroke-dasharray="3,3" fill="none"/>

  <!-- Three Engine Columns -->
  <!-- Column 1: FTS5 -->
  <g transform="translate(40, 140)">
    <rect width="240" height="110" rx="10" fill="#161622" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="20" y="30" fill="#06b6d4" font-family="sans-serif" font-size="12" font-weight="700">1. TEXTO EXATO (FTS5)</text>
    <text x="20" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Nomes de arquivos</text>
    <text x="20" y="73" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Metadados de câmera</text>
    <text x="20" y="91" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Transcrições literais</text>
  </g>

  <!-- Column 2: Semantic RAG -->
  <g transform="translate(320, 140)">
    <rect width="240" height="110" rx="10" fill="#161622" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="20" y="30" fill="#a78bfa" font-family="sans-serif" font-size="12" font-weight="700">2. SEMÂNTICA (ChromaDB)</text>
    <text x="20" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Significado de depoimentos</text>
    <text x="20" y="73" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Conceitos e sinônimos</text>
    <text x="20" y="91" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Análise de sentimentos</text>
  </g>

  <!-- Column 3: CLIP Visual -->
  <g transform="translate(600, 140)">
    <rect width="240" height="110" rx="10" fill="#161622" stroke="#ec4899" stroke-width="1.2"/>
    <text x="20" y="30" fill="#f472b6" font-family="sans-serif" font-size="12" font-weight="700">3. VISUAL CLIP (Local CPU)</text>
    <text x="20" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Iluminação &amp; Paleta de cor</text>
    <text x="20" y="73" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Ações físicas e gestos</text>
    <text x="20" y="91" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Enquadramento &amp; Lentes</text>
  </g>

  <!-- Merge Arrow -->
  <path d="M 160 250 L 440 290" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3" fill="none"/>
  <path d="M 440 250 L 440 290" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3,3" fill="none"/>
  <path d="M 720 250 L 440 290" stroke="#ec4899" stroke-width="2" stroke-dasharray="3,3" fill="none"/>

  <!-- Output Box -->
  <g transform="translate(140, 295)">
    <rect width="600" height="60" rx="10" fill="#161622" stroke="#10b981" stroke-width="1.5"/>
    <text x="25" y="27" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">🎯 RESULTADOS ORDENADOS COM JUSTIFICATIVA RAG</text>
    <text x="25" y="47" fill="#94a3b8" font-family="sans-serif" font-size="11">💡 "BROLL_0192.MOV (01:24): Câmera na mão com diretor conversando sob iluminação quente de tungstênio."</text>
  </g>
</svg>
