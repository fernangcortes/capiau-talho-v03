<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#14141f"/>
    </linearGradient>
  </defs>

  <rect width="880" height="200" rx="14" fill="url(#bgGrad)" stroke="#27273a" stroke-width="1.5"/>

  <!-- Left: Lower Third Sample -->
  <g transform="translate(40, 30)">
    <rect width="360" height="140" rx="10" fill="#161622" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="20" y="30" fill="#a78bfa" font-family="sans-serif" font-size="12" font-weight="700">PRÉVIA DO LOWER THIRD (PISTA V3)</text>
    
    <!-- Glass lower third box -->
    <rect x="20" y="48" width="320" height="70" rx="8" fill="#1e1e2f" fill-opacity="0.8" stroke="#06b6d4" stroke-width="1"/>
    <text x="35" y="76" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Maria da Silva</text>
    <text x="35" y="98" fill="#06b6d4" font-family="sans-serif" font-size="12">Diretora de Fotografia</text>
  </g>

  <!-- Right: Animation Pipeline -->
  <g transform="translate(430, 30)">
    <rect width="410" height="140" rx="10" fill="#161622" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="20" y="30" fill="#06b6d4" font-family="sans-serif" font-size="12" font-weight="700">PIPELINE DE ANIMAÇÃO &amp; KEYFRAMES</text>

    <!-- Steps -->
    <rect x="20" y="48" width="110" height="70" rx="6" fill="#1e1e2f" stroke="#334155"/>
    <text x="30" y="75" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">Entrada</text>
    <text x="30" y="95" fill="#94a3b8" font-family="sans-serif" font-size="10">Slide X + Fade</text>

    <text x="138" y="88" fill="#06b6d4" font-family="sans-serif" font-size="16">➔</text>

    <rect x="155" y="48" width="110" height="70" rx="6" fill="#1e1e2f" stroke="#334155"/>
    <text x="165" y="75" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">Exibição</text>
    <text x="165" y="95" fill="#94a3b8" font-family="sans-serif" font-size="10">Duração: 4-6s</text>

    <text x="273" y="88" fill="#06b6d4" font-family="sans-serif" font-size="16">➔</text>

    <rect x="290" y="48" width="100" height="70" rx="6" fill="#1e1e2f" stroke="#334155"/>
    <text x="300" y="75" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">Saída</text>
    <text x="300" y="95" fill="#94a3b8" font-family="sans-serif" font-size="10">Fade Out</text>
  </g>
</svg>
