      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#14141f"/>
    </linearGradient>
  </defs>

  <rect width="880" height="240" rx="14" fill="url(#bgGrad)" stroke="#27273a" stroke-width="1.5"/>

  <!-- Top Input Boxes -->
  <g transform="translate(100, 30)">
    <rect width="300" height="60" rx="8" fill="#161622" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="20" y="27" fill="#06b6d4" font-family="sans-serif" font-size="12" font-weight="700">MÉTODO 1 • PASTA WATCH/</text>
    <text x="20" y="47" fill="#e2e8f0" font-family="sans-serif" font-size="11">Copiar clipes brutos para watch/</text>
  </g>

  <g transform="translate(480, 30)">
    <rect width="300" height="60" rx="8" fill="#161622" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="20" y="27" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="700">MÉTODO 2 • DIRETÓRIO EXTERNO</text>
    <text x="20" y="47" fill="#e2e8f0" font-family="sans-serif" font-size="11">Apontar pasta de HD/Storage externo</text>
  </g>

