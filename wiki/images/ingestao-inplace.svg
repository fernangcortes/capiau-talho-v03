    <text x="25" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="11">🔒 Arquivos originais intactos no HD • 🛡️ Hash Anti-Duplicata • 🎬 Proxies H.264 em Background • 💾 SQLite</text>
