<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>CapIAu-Talho - Janela com vários painéis</title>
    <!-- F4b do plano docs/PLANO_JANELAS_DRAG_DOCK.md: janela destacada com 2 a 4 painéis de qualquer tipo.
         Os painéis são movidos para cá pelo WorkspaceManager (registerGroupPopout); esta página só
         cuida da disposição, dos divisores e de avisar o editor quando abre/fecha. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="fonts/fonts.css?v=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=90">
    <link rel="stylesheet" href="theme.css?v=5">
    <script src="js/themeBoot.js?v=2"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #0b0f19;
            color: #f8fafc;
            font-family: var(--font-body);
        }
        #group-toolbar {
            height: 32px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 0 8px;
            background: rgba(15, 18, 28, 0.96);
            border-bottom: 1px solid var(--border-glass, rgba(255, 255, 255, 0.08));
            user-select: none;
        }
        .group-toolbar-section { display: flex; align-items: center; gap: 4px; }
        .group-title { font-size: var(--fs-11); font-weight: 600; color: var(--text-secondary, #a1a1aa); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .group-btn {
            width: 26px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary, #a1a1aa);
            font-size: var(--fs-12);
            cursor: pointer;
        }
        .group-btn:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
        .group-btn.active { border-color: rgba(34, 211, 238, 0.5); color: var(--accent, #22d3ee); background: rgba(34, 211, 238, 0.1); }
        .group-btn[disabled] { opacity: 0.35; cursor: default; }
        #group-workspace { flex: 1; min-height: 0; display: flex; }
        .group-box { display: flex; flex: 1 1 0%; min-width: 0; min-height: 0; }
        .group-box.row { flex-direction: row; }
        .group-box.column { flex-direction: column; }
        .group-slot { position: relative; display: flex; flex-direction: column; flex: 1 1 0%; min-width: 120px; min-height: 100px; overflow: hidden; }
        .group-slot > section, .group-slot > aside {
            flex: 1 1 auto !important;
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
            height: 100% !important;
            border-radius: 0 !important;
            border: none !important;
        }
        .group-slot .timeline-track-area { flex: 1 !important; height: calc(100% - 60px) !important; }
        .group-slot .timeline-canvas-wrapper { height: 100% !important; flex: 1 !important; }
        .group-slot-loading { margin: auto; font-size: var(--fs-12); color: var(--text-secondary, #a1a1aa); }
        .group-splitter { flex: 0 0 5px; background: var(--border-glass, rgba(255, 255, 255, 0.08)); touch-action: none; }
        .group-box.row > .group-splitter { cursor: col-resize; }
        .group-box.column > .group-splitter { cursor: row-resize; }
        .group-splitter:hover, .group-splitter.active { background: var(--accent, #22d3ee); }
        /* Recolhido: o espaço vira a linha de expandir, no mesmo lugar; os outros ocupam o resto. */
        .group-slot.group-slot-collapsed { flex: 0 0 4px !important; min-width: 0; min-height: 0; }
        .group-slot.group-slot-collapsed > :not(.group-restore-line) { display: none !important; }
        .group-restore-line { display: none; }
        .group-slot-collapsed > .group-restore-line {
            display: block;
            flex: 1 1 auto;
            cursor: pointer;
            background: rgba(6, 182, 212, 0.18);
            transition: background 0.2s, box-shadow 0.2s;
        }
        .group-slot-collapsed > .group-restore-line:hover {
            background: rgba(6, 182, 212, 0.9);
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.8);
        }
        .group-fill { flex: 1 1 0% !important; }
        .group-select {
            height: 24px;
            margin-left: 6px;
            padding: 0 4px;
            border-radius: 5px;
            border: 1px solid var(--border-glass, rgba(255, 255, 255, 0.08));
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary, #a1a1aa);
            font-size: var(--fs-11);
        }
        /* Caixa com tudo recolhido: fica fininha e as linhas se deitam na outra direção. */
        .group-box.row.group-box-collapsed { flex: 0 0 auto; flex-direction: column; }
        .group-box.column.group-box-collapsed { flex: 0 0 auto; flex-direction: row; }
    </style>
</head>
<body>
    <header id="group-toolbar">
        <div class="group-toolbar-section" style="min-width: 0;">
            <span class="group-title" id="group-title"></span>
        </div>
        <div class="group-toolbar-section">
            <button class="group-btn" data-arrangement="row" data-tooltip="Lado a lado"><i class="fa-solid fa-table-columns"></i></button>
            <button class="group-btn" data-arrangement="column" data-tooltip="Empilhados"><i class="fa-solid fa-grip-lines"></i></button>
            <button class="group-btn" data-arrangement="grid" data-tooltip="Grade 2×2"><i class="fa-solid fa-table-cells-large"></i></button>
            <button class="group-btn" data-arrangement="main" data-tooltip="Principal + coluna"><i class="fa-solid fa-table-list"></i></button>
            <!-- Grade com 3 painéis: o painel sozinho fica embaixo ou em cima dos outros dois -->
            <select id="grid-single-select" class="group-select" data-tooltip="Painel que fica sozinho na grade" style="display: none;"></select>
            <button class="group-btn" id="btn-grid-single" style="display: none;"><i class="fa-solid fa-arrows-up-down"></i></button>
        </div>
        <div class="group-toolbar-section">
            <button class="group-btn" id="btn-group-reattach" data-tooltip="Reacoplar todos ao editor principal"><i class="fa-solid fa-down-left-and-up-right-to-center"></i></button>
        </div>
    </header>
    <main id="group-workspace"></main>

    <script type="module">
        import { edgeInLine, visibleSplitters } from "./js/panelCollapse.js";
        const params = new URLSearchParams(window.location.search);
        const panels = (params.get("group") || "").split(",").map(p => p.trim()).filter(Boolean).slice(0, 4);
        const TITLES = {
            "sidebar-left": "Biblioteca",
            "inspector-panel": "Ajustes & Efeitos",
            "sidebar-right": "Painel Lateral",
            "timeline-panel": "Timeline",
            "source-player-panel": "Source",
            "program-player-panel": "Program",
            // Abas do Painel Lateral destacadas (F5a)
            "tabpanel-transcript": "Falas",
            "tabpanel-vision": "Visão IA",
            "tabpanel-chat": "Chat IA",
            "tabpanel-search": "Busca",
            "tabpanel-tasks": "Tarefas",
            "tabpanel-logs": "Logs",
            // Abas da Biblioteca destacadas (F5b)
            "tabpanel-themes": "Temas",
            "tabpanel-faces": "Rostos",
            "tabpanel-titles": "Títulos",
            "tabpanel-docs": "Docs"
        };
        const ARRANGEMENTS = ["row", "column", "grid", "main"];
        let arrangement = ARRANGEMENTS.includes(params.get("arrangement")) ? params.get("arrangement") : "row";

        window.name = "CapIAu_Group_Window";
        function updateTitle() {
            const title = panels.map(id => TITLES[id] || id).join(" + ");
            document.title = `CapIAu-Talho — ${title}`;
            document.getElementById("group-title").textContent = title;
        }
        updateTitle();

        // ── Posição e tamanho: dock=keep/live = a janela veio de outra (troca de modo ou arrasto) ──
        const boundsKey = "capiau_popout_bounds_group";
        if (!params.get("dock")) {
            try {
                const b = JSON.parse(localStorage.getItem(boundsKey) || "null");
                if (b && b.outerWidth > 200 && b.outerHeight > 200) {
                    window.moveTo(b.screenX, b.screenY);
                    window.resizeTo(b.outerWidth, b.outerHeight);
                }
            } catch (e) {}
        }
        function saveBounds() {
            if (window.outerWidth < 120 || window.outerHeight < 120) return;
            try {
                localStorage.setItem(boundsKey, JSON.stringify({ screenX: window.screenX, screenY: window.screenY, outerWidth: window.outerWidth, outerHeight: window.outerHeight }));
            } catch (e) {}
        }
        window.addEventListener("resize", () => { clearTimeout(window.__bt); window.__bt = setTimeout(saveBounds, 250); });
        setInterval(saveBounds, 3000);

        // ── Espaços: um por painel; o editor move cada painel para o seu ──
        const slots = {};
        panels.forEach(id => {
            const slot = document.createElement("div");
            slot.className = "group-slot";
            slot.dataset.groupSlot = id;
            slot.innerHTML = `<span class="group-slot-loading">Trazendo ${TITLES[id] || id}...</span>`;
            slots[id] = slot;
        });

        function box(direction, children) {
            const el = document.createElement("div");
            el.className = `group-box ${direction}`;
            children.forEach((child, i) => {
                if (i > 0) {
                    const splitter = document.createElement("div");
                    splitter.className = "group-splitter";
                    splitter.setAttribute("data-tooltip", "Arraste para redimensionar (duplo clique iguala)");
                    el.appendChild(splitter);
                }
                el.appendChild(child);
            });
            return el;
        }

        // Grade com 3 painéis: o terceiro fica sozinho embaixo ("bottom") ou em cima ("top").
        let gridSingle = localStorage.getItem("capiau_group_grid_single") === "top" ? "top" : "bottom";
        const btnGridSingle = document.getElementById("btn-grid-single");
        const gridSingleSelect = document.getElementById("grid-single-select");

        /** Monta a disposição movendo os espaços (com os painéis dentro) para as caixas novas. */
        function render(next) {
            arrangement = next;
            const list = panels.map(id => slots[id]);
            let root;
            if (arrangement === "column") root = box("column", list);
            else if (arrangement === "grid" && list.length === 3 && gridSingle === "top") root = box("column", [box("row", list.slice(2)), box("row", list.slice(0, 2))]);
            else if (arrangement === "grid" && list.length > 2) root = box("column", [box("row", list.slice(0, 2)), box("row", list.slice(2))]);
            else if (arrangement === "main" && list.length > 2) root = box("row", [list[0], box("column", list.slice(1))]);
            else root = box("row", list);
            list.forEach(slot => { slot.style.flex = ""; });
            const ws = document.getElementById("group-workspace");
            ws.replaceChildren(root);
            document.querySelectorAll(".group-btn[data-arrangement]").forEach(btn => {
                const a = btn.dataset.arrangement;
                btn.classList.toggle("active", a === arrangement);
                btn.disabled = (a === "grid" || a === "main") && panels.length < 3;
            });
            const gridOf3 = arrangement === "grid" && panels.length === 3;
            btnGridSingle.style.display = gridOf3 ? "" : "none";
            gridSingleSelect.style.display = gridOf3 ? "" : "none";
            gridSingleSelect.innerHTML = panels.map(id => `<option value="${id}">Sozinho: ${TITLES[id] || id}</option>`).join("");
            gridSingleSelect.value = panels[2] || "";
            btnGridSingle.setAttribute("data-tooltip", gridSingle === "top"
                ? `${TITLES[panels[2]] || panels[2]} em cima — clique para pôr embaixo`
                : `${TITLES[panels[2]] || panels[2]} embaixo — clique para pôr em cima`);
            try { localStorage.setItem("capiau_group_popout_arrangement", arrangement); } catch (e) {}
            applyCollapsed();
            // A seta de recolher segue a posição nova (esquerda/direita ou cima/baixo).
            try { window.opener?.workspaceManager?.refreshCollapseArrows?.(); } catch (e) {}
            window.dispatchEvent(new Event("resize"));
        }

        // ── Recolher: o estado mora no editor (salvo, Numpad); ele chama capiauSetPanelCollapsed ──
        const collapsed = new Set();
        const isGone = (el) => el.classList.contains("group-slot-collapsed") || el.classList.contains("group-box-collapsed");

        /** Linha de expandir dentro do espaço (o editor limpa o espaço ao trazer o painel). */
        function ensureLine(id) {
            if (slots[id].querySelector(":scope > .group-restore-line")) return;
            const line = document.createElement("div");
            line.className = "group-restore-line";
            line.setAttribute("data-tooltip", `Expandir ${TITLES[id] || id}`);
            line.addEventListener("click", () => {
                try {
                    if (window.opener && !window.opener.closed && window.opener.workspaceManager?.setPanelCollapsed) {
                        window.opener.workspaceManager.setPanelCollapsed(id, false);
                        return;
                    }
                } catch (e) {}
                window.capiauSetPanelCollapsed(id, false);
            });
            slots[id].appendChild(line);
        }

        function applyCollapsed() {
            panels.forEach(id => {
                ensureLine(id);
                slots[id].classList.toggle("group-slot-collapsed", collapsed.has(id));
            });
            // Das caixas de dentro para as de fora: divisores só entre visíveis, o último visível enche.
            [...document.querySelectorAll("#group-workspace .group-box")].reverse().forEach(b => {
                const kids = [...b.children];
                const seq = kids.map(k => k.classList.contains("group-splitter") ? "splitter" : !isGone(k));
                visibleSplitters(seq).forEach((show, i) => { if (show !== null) kids[i].style.display = show ? "" : "none"; });
                b.classList.toggle("group-box-collapsed", !seq.includes(true));
                kids.forEach(k => k.classList.remove("group-fill"));
                if (seq.includes(false)) kids.filter((k, i) => seq[i] === true).pop()?.classList.add("group-fill");
            });
            window.dispatchEvent(new Event("resize"));
        }

        window.capiauSetPanelCollapsed = (id, isCollapsed) => {
            if (!slots[id]) return;
            if (isCollapsed) collapsed.add(id); else collapsed.delete(id);
            applyCollapsed();
        };
        window.capiauPanelEdge = (id) => {
            // Sozinho na sua caixa (ex.: painel único da grade), vale a posição da caixa na de fora.
            let item = slots[id];
            let boxEl = item?.parentElement;
            if (!boxEl?.classList.contains("group-box")) return null;
            const itemsOf = (b) => [...b.children].filter(k => !k.classList.contains("group-splitter"));
            while (itemsOf(boxEl).length === 1 && boxEl.parentElement?.classList.contains("group-box")) {
                item = boxEl;
                boxEl = boxEl.parentElement;
            }
            const items = itemsOf(boxEl);
            return edgeInLine(boxEl.classList.contains("column") ? "column" : "row", items.indexOf(item), items.length);
        };

        /** Nova ordem (mesmos painéis): os espaços trocam de lugar, os painéis vão junto. */
        window.capiauSetGroupOrder = (order) => {
            if ([...order].sort().join() !== [...panels].sort().join()) return;
            panels.splice(0, panels.length, ...order);
            updateTitle();
            render(arrangement);
        };

        // Trocar de lugar passa pelo editor (salva e entra no desfazer); sem editor, só aqui.
        function swapPanels(a, b) {
            try {
                if (window.opener && !window.opener.closed && window.opener.workspaceManager?.swapGroupPanels) {
                    window.opener.workspaceManager.swapGroupPanels(a, b);
                    return;
                }
            } catch (e) {}
            const order = [...panels];
            const i = order.indexOf(a), j = order.indexOf(b);
            if (i < 0 || j < 0) return;
            [order[i], order[j]] = [order[j], order[i]];
            window.capiauSetGroupOrder(order);
        }

        gridSingleSelect.addEventListener("change", () => {
            const chosen = gridSingleSelect.value;
            if (chosen && chosen !== panels[2]) swapPanels(chosen, panels[2]);
        });

        btnGridSingle.addEventListener("click", () => {
            gridSingle = gridSingle === "top" ? "bottom" : "top";
            try { localStorage.setItem("capiau_group_grid_single", gridSingle); } catch (e) {}
            render("grid");
        });


        document.querySelectorAll(".group-btn[data-arrangement]").forEach(btn => {
            btn.addEventListener("click", () => {
                render(btn.dataset.arrangement);
                try { window.opener?.workspaceManager?.setGroupArrangement?.(arrangement); } catch (e) {}
            });
        });

        // Divisores: arrastar muda o tamanho do item anterior; duplo clique iguala a caixa.
        document.addEventListener("pointerdown", (e) => {
            const splitter = e.target.closest(".group-splitter");
            if (!splitter || e.button !== 0) return;
            e.preventDefault();
            let prev = splitter.previousElementSibling;
            while (prev && (prev.classList.contains("group-splitter") || isGone(prev))) prev = prev.previousElementSibling;
            if (!prev) return;
            const isRow = splitter.parentElement.classList.contains("row");
            const start = isRow ? e.clientX : e.clientY;
            const startSize = isRow ? prev.getBoundingClientRect().width : prev.getBoundingClientRect().height;
            splitter.setPointerCapture(e.pointerId);
            splitter.classList.add("active");
            const move = (ev) => {
                const size = Math.max(100, startSize + (isRow ? ev.clientX : ev.clientY) - start);
                prev.style.flex = `0 0 ${Math.round(size)}px`;
            };
            const up = () => {
                splitter.classList.remove("active");
                splitter.removeEventListener("pointermove", move);
                splitter.removeEventListener("pointerup", up);
                window.dispatchEvent(new Event("resize"));
            };
            splitter.addEventListener("pointermove", move);
            splitter.addEventListener("pointerup", up);
        });
        document.addEventListener("dblclick", (e) => {
            const splitter = e.target.closest(".group-splitter");
            if (!splitter) return;
            [...splitter.parentElement.children].forEach(c => { if (!c.classList.contains("group-splitter")) c.style.flex = ""; });
            window.dispatchEvent(new Event("resize"));
        });

        render(arrangement);

        // ── Conexão com o editor principal ──
        const channel = new BroadcastChannel("capiau-workspace-sync");
        function connect() {
            try {
                if (window.opener && !window.opener.closed && window.opener.workspaceManager?.registerGroupPopout) {
                    window.opener.workspaceManager.registerGroupPopout(panels, window, arrangement);
                }
            } catch (e) {}
            channel.postMessage({ type: "GROUP_POPOUT_READY", panels, arrangement, timestamp: Date.now() });
        }
        connect();
        setTimeout(connect, 150);
        setTimeout(connect, 500);

        document.getElementById("btn-group-reattach").addEventListener("click", () => {
            try {
                if (window.opener && !window.opener.closed && window.opener.workspaceManager?.restoreGroupPopout) {
                    window.opener.workspaceManager.restoreGroupPopout();
                    return;
                }
            } catch (e) {}
            channel.postMessage({ type: "GROUP_POPOUT_CLOSED", panels });
            window.close();
        });

        window.addEventListener("beforeunload", () => {
            saveBounds();
            channel.postMessage({ type: "GROUP_POPOUT_CLOSED", panels, windowName: window.name });
        });
    </script>
    <div id="global-tooltip"></div>
</body>
</html>
