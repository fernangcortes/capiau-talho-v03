<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#14141f"/>
    </linearGradient>
  </defs>

  <rect width="880" height="260" rx="14" fill="url(#bgGrad)" stroke="#27273a" stroke-width="1.5"/>

  <!-- Top Input -->
  <g transform="translate(40, 25)">
    <rect width="800" height="42" rx="8" fill="#161622" stroke="#475569" stroke-width="1"/>
    <text x="20" y="26" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">🎙️ Áudio do Usuário (WAV) ➔ Análise FFmpeg (ebur128, astats, volumedetect) ➔ Vetor [LUFS, LRA, TP, Floor, Clip, Flat]</text>
  </g>

  <!-- Connectors -->
  <path d="M 440 67 L 260 100" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3" fill="none"/>
  <path d="M 440 67 L 620 100" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3,3" fill="none"/>

  <!-- Branch 1: Online AI -->
  <g transform="translate(60, 100)">
    <rect width="360" height="80" rx="8" fill="#161622" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="18" y="26" fill="#06b6d4" font-family="sans-serif" font-size="12" font-weight="700">MODO ONLINE (LLM / IA DISPONÍVEL)</text>
    <text x="18" y="48" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Análise semântica profunda da acústica</text>
    <text x="18" y="66" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Geração de relatório explicativo rico</text>
  </g>

  <!-- Branch 2: Offline KNN -->
  <g transform="translate(460, 100)">
    <rect width="360" height="80" rx="8" fill="#161622" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="18" y="26" fill="#a78bfa" font-family="sans-serif" font-size="12" font-weight="700">MODO OFFLINE (KNN / CLUSTERING)</text>
    <text x="18" y="48" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Busca por distância vetorial na base de perfis</text>
    <text x="18" y="66" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Classificação instantânea sem latência</text>
  </g>

  <!-- Convergence to Output -->
  <path d="M 240 180 L 440 200" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3" fill="none"/>
  <path d="M 640 180 L 440 200" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3,3" fill="none"/>

  <g transform="translate(140, 200)">
    <rect width="600" height="42" rx="8" fill="#161622" stroke="#10b981" stroke-width="1.5"/>
    <text x="25" y="26" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">⚡ 1-CLICK APPLY: Prescrição DSP Local (FFmpeg) ou Auphonic Cloud</text>
  </g>
</svg>
