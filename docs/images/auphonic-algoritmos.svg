<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#14141f"/>
    </linearGradient>
  </defs>

  <rect width="920" height="220" rx="14" fill="url(#bgGrad)" stroke="#27273a" stroke-width="1.5"/>

  <!-- Input -->
  <g transform="translate(25, 30)">
    <rect width="160" height="160" rx="10" fill="#161622" stroke="#475569" stroke-width="1.2"/>
    <text x="15" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="700">ENTRADA</text>
    <text x="15" y="60" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">PCM 24-bit / 48kHz</text>
    <text x="15" y="80" fill="#94a3b8" font-family="sans-serif" font-size="10">• Som direto do set</text>
    <text x="15" y="98" fill="#94a3b8" font-family="sans-serif" font-size="10">• Lapela / Boom / Cam</text>
    <text x="15" y="116" fill="#94a3b8" font-family="sans-serif" font-size="10">• Áudio sem perdas</text>
  </g>

  <text x="195" y="115" fill="#06b6d4" font-family="sans-serif" font-size="18">➔</text>

  <!-- Step 1 -->
  <g transform="translate(215, 30)">
    <rect width="210" height="160" rx="10" fill="#161622" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="15" y="30" fill="#06b6d4" font-family="sans-serif" font-size="11" font-weight="700">1. FILTRAGEM &amp; RESTAURAÇÃO</text>
    <text x="15" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="10">• Adaptive High-Pass (&lt;80Hz)</text>
    <text x="15" y="73" fill="#e2e8f0" font-family="sans-serif" font-size="10">• Voice AutoEQ (De-esser)</text>
    <text x="15" y="91" fill="#e2e8f0" font-family="sans-serif" font-size="10">• Bandwidth Ext (10-20kHz)</text>
    <text x="15" y="109" fill="#e2e8f0" font-family="sans-serif" font-size="10">• Studio Voice (Clipping Fix)</text>
  </g>

  <text x="435" y="115" fill="#3b82f6" font-family="sans-serif" font-size="18">➔</text>

  <!-- Step 2 -->
  <g transform="translate(455, 30)">
    <rect width="210" height="160" rx="10" fill="#161622" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="15" y="30" fill="#a78bfa" font-family="sans-serif" font-size="11" font-weight="700">2. DENOISING &amp; ACÚSTICA</text>
    <text x="15" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="10">• Dynamic Denoiser</text>
    <text x="15" y="73" fill="#e2e8f0" font-family="sans-serif" font-size="10">• Dereverberation (Eco Sala)</text>
    <text x="15" y="91" fill="#e2e8f0" font-family="sans-serif" font-size="10">• Breath Reduction</text>
    <text x="15" y="109" fill="#e2e8f0" font-family="sans-serif" font-size="10">• Speech Isolation Cirúrgico</text>
  </g>

  <text x="675" y="115" fill="#8b5cf6" font-family="sans-serif" font-size="18">➔</text>

  <!-- Step 3 -->
  <g transform="translate(695, 30)">
    <rect width="200" height="160" rx="10" fill="#161622" stroke="#10b981" stroke-width="1.2"/>
    <text x="15" y="30" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">3. DINÂMICA &amp; MASTER</text>
    <text x="15" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="10">• Adaptive Leveler (Ganho)</text>
    <text x="15" y="73" fill="#e2e8f0" font-family="sans-serif" font-size="10">• Loudness (-14 / -23 LUFS)</text>
    <text x="15" y="91" fill="#e2e8f0" font-family="sans-serif" font-size="10">• True Peak Limiter (-1 dBTP)</text>
    <text x="15" y="109" fill="#e2e8f0" font-family="sans-serif" font-size="10">• Normalização EBU R128</text>
  </g>
</svg>
