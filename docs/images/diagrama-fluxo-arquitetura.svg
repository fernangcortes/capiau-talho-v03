<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#14141f"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" rx="16" fill="url(#bgGrad)" stroke="#27273a" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="45" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">🎬 Arquitetura de Fluxo do CapIAu-Talho</text>
  <text x="40" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Operação Híbrida: Processamento Local em CPU + Nuvem Cirúrgica</text>

  <!-- 1. Armazenamento -->
  <g transform="translate(40, 95)">
    <rect width="210" height="150" rx="10" fill="#161622" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="18" y="28" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="700">💾 ARMAZENAMENTO</text>
    <text x="18" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Vídeos &amp; Fotos Originais</text>
    <text x="18" y="75" fill="#e2e8f0" font-family="sans-serif" font-size="11">• .MOV, .MP4, .MTS, .CR2</text>
    <text x="18" y="95" fill="#e2e8f0" font-family="sans-serif" font-size="11">• HDs / SSDs Externos</text>
    <text x="18" y="125" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="700">🔒 Nunca são copiados</text>
  </g>

  <!-- Arrow Armazenamento -> Backend -->
  <path d="M 250 170 L 290 170" stroke="#06b6d4" stroke-width="2.5" fill="none"/>
  <polygon points="288,166 296,170 288,174" fill="#06b6d4"/>

  <!-- 2. Backend Local -->
  <g transform="translate(290, 95)">
    <rect width="380" height="490" rx="12" fill="#161622" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="20" y="30" fill="#06b6d4" font-family="sans-serif" font-size="13" font-weight="700">🐍 BACKEND FASTAPI (100% CPU LOCAL)</text>
    
    <!-- Ingest & Media -->
    <rect x="20" y="45" width="340" height="45" rx="6" fill="#1e1e2f" stroke="#2d2d42"/>
    <text x="30" y="66" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">⚡ Ingestor + FFmpeg</text>
    <text x="30" y="82" fill="#94a3b8" font-family="sans-serif" font-size="10">Varredura, SHA-256, Proxies 720p H.264, Áudio MP3 16kHz</text>

    <!-- Segmentation -->
    <rect x="20" y="98" width="340" height="45" rx="6" fill="#1e1e2f" stroke="#2d2d42"/>
    <text x="30" y="119" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">🎞️ PySceneDetect + OpenCV</text>
    <text x="30" y="135" fill="#94a3b8" font-family="sans-serif" font-size="10">Cortes reais, subdivisão em beats e fluxo óptico de câmera</text>

    <!-- Vision & Faces -->
    <rect x="20" y="151" width="340" height="45" rx="6" fill="#1e1e2f" stroke="#2d2d42"/>
    <text x="30" y="172" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">👥 InsightFace ONNX + CLIP Local</text>
    <text x="30" y="188" fill="#94a3b8" font-family="sans-serif" font-size="10">Detecção facial SCRFD, DBSCAN e vetores visuais CLIP</text>

    <!-- Audio DSP -->
    <rect x="20" y="204" width="340" height="45" rx="6" fill="#1e1e2f" stroke="#2d2d42"/>
    <text x="30" y="225" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">🔊 Motor de Áudio &amp; DeepFilterNet</text>
    <text x="30" y="241" fill="#94a3b8" font-family="sans-serif" font-size="10">Diagnóstico EBU R128 LUFS, EQ 3 bandas e denoise neural CPU</text>

    <!-- Database & Vector Store -->
    <rect x="20" y="257" width="340" height="70" rx="6" fill="#1e1e2f" stroke="#8b5cf6"/>
    <text x="30" y="278" fill="#a78bfa" font-family="sans-serif" font-size="11" font-weight="700">💾 Armazenamento de Dados Local</text>
    <text x="30" y="296" fill="#e2e8f0" font-family="sans-serif" font-size="10">• SQLite: Metadados, Diálogos, Projetos e Cortes</text>
    <text x="30" y="312" fill="#e2e8f0" font-family="sans-serif" font-size="10">• ChromaDB: Embeddings de Texto e Imagens (&lt; 5ms)</text>

    <!-- Task Manager -->
    <rect x="20" y="335" width="340" height="60" rx="6" fill="#1e1e2f" stroke="#10b981"/>
    <text x="30" y="356" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">⚡ TASK_MANAGER &amp; WebSockets</text>
    <text x="30" y="374" fill="#94a3b8" font-family="sans-serif" font-size="10">Processamento em background, streaming de logs e cancelamento</text>

    <!-- Exporters -->
    <rect x="20" y="403" width="340" height="70" rx="6" fill="#1e1e2f" stroke="#f59e0b"/>
    <text x="30" y="424" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700">🎬 Exportadores &amp; Render FFmpeg</text>
    <text x="30" y="442" fill="#e2e8f0" font-family="sans-serif" font-size="10">• OpenTimelineIO (.otio) ➔ Kdenlive 25.04+</text>
    <text x="30" y="458" fill="#e2e8f0" font-family="sans-serif" font-size="10">• FCP7 XML ➔ Premiere / Resolve • Render Master MP4</text>
  </g>

  <!-- 3. Nuvem Cirúrgica -->
  <g transform="translate(710, 95)">
    <rect width="210" height="230" rx="10" fill="#161622" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="18" y="28" fill="#a78bfa" font-family="sans-serif" font-size="12" font-weight="700">☁️ NUVEM (CIRÚRGICA)</text>
    
    <rect x="15" y="45" width="180" height="40" rx="4" fill="#1e1e2f" stroke="#2d2d42"/>
    <text x="25" y="63" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">AssemblyAI / Groq</text>
    <text x="25" y="77" fill="#94a3b8" font-family="sans-serif" font-size="9">Transcrição + Diarização</text>

    <rect x="15" y="93" width="180" height="40" rx="4" fill="#1e1e2f" stroke="#2d2d42"/>
    <text x="25" y="111" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">Gemini / OpenRouter</text>
    <text x="25" y="125" fill="#94a3b8" font-family="sans-serif" font-size="9">Títulos &amp; Agente RAG</text>

    <rect x="15" y="141" width="180" height="40" rx="4" fill="#1e1e2f" stroke="#2d2d42"/>
    <text x="25" y="159" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">Auphonic Cloud</text>
    <text x="25" y="173" fill="#94a3b8" font-family="sans-serif" font-size="9">Restauro Pro (Opcional)</text>

    <text x="18" y="210" fill="#94a3b8" font-family="sans-serif" font-size="10">Chamadas sob demanda</text>
  </g>

  <!-- Connectors Backend <-> Cloud -->
  <path d="M 670 170 L 710 170" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3,3" fill="none"/>
  <path d="M 710 200 L 670 200" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3,3" fill="none"/>

  <!-- 4. Frontend Web NLE -->
  <g transform="translate(710, 355)">
    <rect width="210" height="230" rx="10" fill="#161622" stroke="#10b981" stroke-width="1.2"/>
    <text x="18" y="28" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">💻 FRONTEND NLE</text>
    <text x="18" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Timeline Canvas 2D</text>
    <text x="18" y="75" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Monitores Source / Program</text>
    <text x="18" y="95" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Biblioteca em Árvore</text>
    <text x="18" y="115" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Inspetor de Fala Waveform</text>
    <text x="18" y="135" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Atalhos JKL &amp; Shift+E</text>
    <text x="18" y="155" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Agente com Ghost Clips</text>
    <text x="18" y="175" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Layout Seamless Flat</text>
    <text x="18" y="210" fill="#06b6d4" font-family="sans-serif" font-size="10" font-weight="700">Modern Vanilla JS SPA</text>
  </g>

  <!-- Connectors Backend <-> Frontend -->
  <path d="M 670 470 L 710 470" stroke="#10b981" stroke-width="2.5" fill="none"/>
  <polygon points="708,466 716,470 708,474" fill="#10b981"/>
</svg>
