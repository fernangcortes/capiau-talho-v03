<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#14141f"/>
    </linearGradient>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ef4444" fill-opacity="0.14"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ef4444" stroke-width="2" stroke-opacity="0.55"/>
    </pattern>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .h { fill: #f8fafc; font-size: 19px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 12px; }
      .lbl { font-size: 11px; font-weight: 700; }
      .trk { fill: #94a3b8; font-size: 10px; font-weight: 700; }
      .clip { font-size: 9.5px; fill: #e2e8f0; }
      .same { fill: #2a2a3d; stroke: #3f3f5a; stroke-width: 1; }
      .add { fill: #22c55e; fill-opacity: 0.13; stroke: #22c55e; stroke-width: 1.4; stroke-dasharray: 4 3; }
      .mod { fill: #f59e0b; fill-opacity: 0.16; stroke: #f59e0b; stroke-width: 1.4; }
      .del { fill: url(#hatch); stroke: #ef4444; stroke-width: 1.4; }
      .lane { fill: #12121c; }
      .hunk { fill: #161622; stroke: #2d2d42; stroke-width: 1; }
      .ht { fill: #f8fafc; font-size: 10.5px; font-weight: 700; }
      .hd { fill: #94a3b8; font-size: 9.5px; }
    </style>
  </defs>

  <rect width="880" height="580" rx="16" fill="url(#bgGrad)" stroke="#27273a" stroke-width="1.5"/>

  <text x="32" y="40" class="h">Sequência Fantasma no modo Contracampo</text>
  <text x="32" y="62" class="sub">A base (corte do editor) e a proposta ficam empilhadas, com agulha e rolagem sincronizadas.</text>

  <!-- ===== BASE ===== -->
  <rect x="24" y="80" width="584" height="178" rx="10" fill="#161622" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="36" y="99" class="lbl" fill="#06b6d4">BASE · corte do editor · revisão 41</text>

  <text x="36" y="124" class="trk">T1</text>
  <rect x="92" y="110" width="508" height="22" class="lane"/>
  <text x="36" y="153" class="trk">V2</text>
  <rect x="92" y="136" width="508" height="26" class="lane"/>
  <rect x="236" y="138" width="70" height="22" rx="3" class="same"/>
  <text x="242" y="153" class="clip">oficina</text>
  <text x="36" y="183" class="trk">V1</text>
  <rect x="92" y="166" width="508" height="26" class="lane"/>
  <rect x="92" y="168" width="104" height="22" rx="3" class="same"/>
  <text x="98" y="183" class="clip">Ana 1</text>
  <rect x="200" y="168" width="118" height="22" rx="3" class="del"/>
  <text x="206" y="183" class="clip">Ana 2 (sai)</text>
  <rect x="322" y="168" width="130" height="22" rx="3" class="mod"/>
  <text x="328" y="183" class="clip">João 1 (vai p/ abertura)</text>
  <rect x="456" y="168" width="144" height="22" rx="3" class="same"/>
  <text x="462" y="183" class="clip">Ana 3</text>
  <text x="36" y="210" class="trk">A1</text>
  <rect x="92" y="196" width="508" height="20" class="lane"/>
  <rect x="92" y="198" width="104" height="16" rx="3" class="same"/>
  <rect x="200" y="198" width="118" height="16" rx="3" class="del"/>
  <rect x="322" y="198" width="130" height="16" rx="3" class="mod"/>
  <rect x="456" y="198" width="144" height="16" rx="3" class="same"/>
  <text x="36" y="234" class="trk">A2</text>
  <rect x="92" y="220" width="508" height="20" class="lane"/>
  <rect x="236" y="222" width="70" height="16" rx="3" class="same"/>

  <!-- ===== FANTASMA ===== -->
  <rect x="24" y="268" width="584" height="222" rx="10" fill="#161622" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="36" y="287" class="lbl" fill="#a78bfa">FANTASMA · proposta "Abertura" · sobre a revisão 41</text>

  <text x="36" y="310" class="trk">T1</text>
  <rect x="92" y="296" width="508" height="22" class="lane"/>
  <rect x="96" y="298" width="96" height="18" rx="3" class="add"/>
  <text x="101" y="311" class="clip">GC: João, ferreiro</text>

  <text x="36" y="334" class="trk" fill="#22c55e">V3 +</text>
  <rect x="92" y="322" width="508" height="20" class="lane"/>
  <rect x="92" y="324" width="508" height="16" rx="3" class="add"/>
  <text x="98" y="336" class="clip">camada de ajuste · look quente (colorista)</text>

  <text x="36" y="363" class="trk">V2</text>
  <rect x="92" y="346" width="508" height="26" class="lane"/>
  <rect x="120" y="348" width="82" height="22" rx="3" class="add"/>
  <text x="125" y="363" class="clip">detalhe mãos</text>
  <rect x="334" y="348" width="70" height="22" rx="3" class="add"/>
  <text x="339" y="363" class="clip">oficina (PG)</text>

  <text x="36" y="393" class="trk">V1</text>
  <rect x="92" y="376" width="508" height="26" class="lane"/>
  <rect x="92" y="378" width="114" height="22" rx="3" class="mod"/>
  <text x="98" y="393" class="clip">João 1 · aparado</text>
  <rect x="210" y="378" width="104" height="22" rx="3" class="same"/>
  <text x="216" y="393" class="clip">Ana 1</text>
  <polygon points="316,382 321,389 316,396 311,389" fill="#06b6d4"/>
  <rect x="322" y="378" width="96" height="22" rx="3" class="add"/>
  <text x="328" y="393" class="clip">Ana 7 · nova fala</text>
  <rect x="422" y="378" width="144" height="22" rx="3" class="same"/>
  <text x="428" y="393" class="clip">Ana 3</text>
  <rect x="566" y="381" width="30" height="16" rx="3" fill="none" stroke="#64748b" stroke-dasharray="2 2"/>
  <text x="512" y="374" class="hd">ripple −0,6 s</text>

  <text x="36" y="421" class="trk">A1</text>
  <rect x="92" y="406" width="508" height="20" class="lane"/>
  <rect x="92" y="408" width="114" height="16" rx="3" class="mod"/>
  <rect x="210" y="408" width="88" height="16" rx="3" class="same"/>
  <rect x="300" y="408" width="118" height="16" rx="3" class="add"/>
  <text x="305" y="420" class="clip">J-cut</text>
  <rect x="422" y="408" width="144" height="16" rx="3" class="same"/>

  <text x="36" y="445" class="trk">A2</text>
  <rect x="92" y="430" width="508" height="20" class="lane"/>
  <rect x="92" y="432" width="236" height="16" rx="3" class="add"/>
  <text x="98" y="444" class="clip">ambiência da oficina</text>

  <text x="36" y="469" class="trk" fill="#22c55e">A3 +</text>
  <rect x="92" y="454" width="508" height="20" class="lane"/>
  <rect x="210" y="456" width="390" height="16" rx="3" class="add"/>
  <text x="216" y="468" class="clip">trilha · −18 dB sob a fala (ducking)</text>

  <!-- Agulha compartilhada -->
  <line x1="500" y1="106" x2="500" y2="482" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="494,102 506,102 500,110" fill="#ef4444"/>

  <!-- ===== BLOCOS ===== -->
  <rect x="620" y="80" width="236" height="410" rx="10" fill="#161622" stroke="#27273a" stroke-width="1.2"/>
  <text x="632" y="99" class="lbl" fill="#f8fafc">BLOCOS DA PROPOSTA</text>
  <text x="632" y="114" class="hd">aceitar ✓ · recusar ✕ · editar na aba</text>

  <rect x="630" y="124" width="216" height="62" rx="6" class="hunk"/>
  <text x="640" y="142" class="ht">B1 · Estrutura</text>
  <text x="640" y="157" class="hd">Diretora: abrir com a tese do João</text>
  <text x="640" y="172" class="hd">2 operações · risco: atenção</text>
  <text x="808" y="142" class="ht" fill="#22c55e">✓ ✕</text>

  <rect x="630" y="194" width="216" height="62" rx="6" class="hunk"/>
  <text x="640" y="212" class="ht">B2 · Montagem</text>
  <text x="640" y="227" class="hd">Montadora: Ana 2 repete; entra Ana 7</text>
  <text x="640" y="242" class="hd">3 operações · evidência: fala 98–131</text>
  <text x="808" y="212" class="ht" fill="#22c55e">✓ ✕</text>

  <rect x="630" y="264" width="216" height="62" rx="6" class="hunk"/>
  <text x="640" y="282" class="ht">B3 · Cobertura</text>
  <text x="640" y="297" class="hd">Detalhe das mãos e plano geral</text>
  <text x="640" y="312" class="hd">depende de B1 · 2 operações</text>
  <text x="808" y="282" class="ht" fill="#22c55e">✓ ✕</text>

  <rect x="630" y="334" width="216" height="62" rx="6" class="hunk"/>
  <text x="640" y="352" class="ht">B4 · Som</text>
  <text x="640" y="367" class="hd">J-cut, ambiência, trilha com ducking</text>
  <text x="640" y="382" class="hd">medido: −23 LUFS na fala</text>
  <text x="808" y="352" class="ht" fill="#22c55e">✓ ✕</text>

  <rect x="630" y="404" width="216" height="62" rx="6" class="hunk"/>
  <text x="640" y="422" class="ht">B5 · Grafismo e cor</text>
  <text x="640" y="437" class="hd">GC do João (nome do elenco), look</text>
  <text x="640" y="452" class="hd">2 operações · risco: seguro</text>
  <text x="808" y="422" class="ht" fill="#22c55e">✓ ✕</text>

  <!-- ===== LEGENDA ===== -->
  <rect x="24" y="504" width="832" height="56" rx="10" fill="#161622" stroke="#27273a" stroke-width="1"/>
  <rect x="40" y="524" width="26" height="14" rx="3" class="same"/>
  <text x="72" y="535" class="hd">igual à base</text>
  <rect x="156" y="524" width="26" height="14" rx="3" class="add"/>
  <text x="188" y="535" class="hd">acrescentado</text>
  <rect x="272" y="524" width="26" height="14" rx="3" class="mod"/>
  <text x="304" y="535" class="hd">alterado (aparo, movimento)</text>
  <rect x="452" y="524" width="26" height="14" rx="3" class="del"/>
  <text x="484" y="535" class="hd">removido (marcado na base)</text>
  <polygon points="636,524 642,531 636,538 630,531" fill="#06b6d4"/>
  <text x="648" y="535" class="hd">transição</text>
  <rect x="718" y="524" width="26" height="14" rx="3" fill="none" stroke="#64748b" stroke-dasharray="2 2"/>
  <text x="750" y="535" class="hd">deslocado por ripple</text>
  <text x="40" y="552" class="hd">Pistas novas (V3, A3) nascem só na fantasma e entram na base junto com o bloco que as usa.</text>
</svg>
