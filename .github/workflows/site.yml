# Publica o site de apresentação (pasta site/) no GitHub Pages.
# Uma vez só, no GitHub: Settings › Pages › Build and deployment › Source: GitHub Actions.
name: Site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Monta a pasta publicada (sem o modelo de página e o README)
        run: |
          mkdir -p _site
          cp -r site/. _site/
          rm -f _site/_modelo.html _site/README.md

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publica
        id: deployment
        uses: actions/deploy-pages@v4
